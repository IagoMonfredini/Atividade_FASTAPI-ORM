<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechControl - Editar #{{ categoria.id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #022c22;
            background-image: radial-gradient(#064e3b 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white/95 backdrop-blur-sm p-10 rounded-3xl shadow-2xl w-full max-w-lg border border-white/20">
        <div class="flex items-center gap-3 mb-8 pb-4 border-b border-gray-100">
            <div class="p-3 bg-emerald-100 rounded-2xl text-emerald-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-emerald-950 tracking-tight">Atualizar Categoria</h2>
                <p class="text-sm text-gray-500 font-mono">ID do Registro: #{{ categoria.id }}</p>
            </div>
        </div>

        <form action="/categorias/{{ categoria.id }}/editar" method="POST" class="space-y-6">
            <div class="space-y-1">
                <label class="text-sm font-semibold text-emerald-900 ml-1">Nome da Categoria</label>
                <input type="text" name="nome" value="{{ categoria.nome }}" required class="w-full border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-emerald-200 focus:border-emerald-400 transition bg-white text-lg font-medium">
            </div>
            <div class="space-y-1">
                <label class="text-sm font-semibold text-emerald-900 ml-1">Descrição Detalhada</label>
                <textarea name="descricao" rows="4" class="w-full border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-emerald-200 focus:border-emerald-400 transition bg-white font-light text-gray-700">{{ categoria.descricao }}</textarea>
            </div>
            
            <div class="flex justify-between items-center pt-6">
                <a href="/categorias" class="flex items-center gap-2 text-gray-500 hover:text-emerald-700 transition group">
                    <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Cancelar e Voltar
                </a>
                <button type="submit" class="bg-emerald-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-emerald-700 transition duration-150 shadow-lg shadow-emerald-500/30 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Commitar Alterações
                </button>
            </div>
        </form>
    </div>
</body>
</html>
