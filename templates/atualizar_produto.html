<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechControl - Editar Produto #{{ produto.id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #022c22;
            background-image: radial-gradient(#064e3b 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white/95 backdrop-blur-sm p-10 rounded-3xl shadow-2xl w-full max-w-lg border border-white/20">
        <div class="flex items-center gap-3 mb-8 pb-4 border-b border-gray-100">
            <div class="p-3 bg-emerald-100 rounded-2xl text-emerald-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-emerald-950 tracking-tight">Editar Produto</h2>
                <p class="text-sm text-gray-500 font-mono">SKU ID: #{{ produto.id }}</p>
            </div>
        </div>

        <form action="/produtos/{{ produto.id }}/editar" method="POST" class="space-y-5">
            <div class="space-y-1">
                <label class="text-xs font-bold text-emerald-900 uppercase">Nome do Item</label>
                <input type="text" name="nome" value="{{ produto.nome }}" required class="w-full border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-emerald-200 bg-white">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-emerald-900 uppercase">Preço (R$)</label>
                    <input type="number" step="0.01" name="preco" value="{{ produto.preco }}" required class="w-full border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-emerald-200 bg-white">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-emerald-900 uppercase">Estoque Atual</label>
                    <input type="number" name="estoque" value="{{ produto.estoque }}" required class="w-full border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-emerald-200 bg-white">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-emerald-900 uppercase">Categoria</label>
                <select name="categoria_id" required class="w-full border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-emerald-200 bg-white appearance-none text-gray-700">
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if cat.id == produto.categoria_id %}selected{% endif %}>
                        {{ cat.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="flex justify-between items-center pt-6">
                <a href="/produtos" class="text-gray-500 hover:text-emerald-700 transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Voltar
                </a>
                <button type="submit" class="bg-emerald-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-emerald-700 shadow-lg shadow-emerald-500/30">
                    Salvar Alterações
                </button>
            </div>
        </form>
    </div>
</body>
</html>
